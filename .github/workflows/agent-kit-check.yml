name: agent-kit check

on:
  push:
    branches: [main]
    paths:
      - "agent-kit/**"
      - ".claude/**"
      - ".cursor/**"
      - ".github/copilot-instructions.md"
      - "AGENTS.md"
      - ".github/workflows/agent-kit-check.yml"
  pull_request:
    branches: [main]

jobs:
  check:
    # Linux on purpose: the generator must produce byte-identical output off Windows.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Test the generator
        run: dotnet test agent-kit/AgentKit.slnx --nologo

      - name: Generated files are up to date
        run: dotnet run --project agent-kit/src/DotNet.Practices.AgentKit -- "${{ github.workspace }}" --check
